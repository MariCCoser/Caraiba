# Publica o jogo de Jogar/navegador no GitHub Pages (https://mariccoser.github.io/Caraiba/),
# para qualquer pessoa jogar no navegador. Roda sozinho quando essa pasta muda no main
# (e também à mão, na aba Actions, em "Run workflow").
#
# Precisa ligar uma vez: Settings > Pages > Build and deployment > Source: "GitHub Actions"
# (ligado em 26/10/2026).

name: Publicar o jogo

on:
  push:
    branches: [main]
    paths: ["Jogar/navegador/**", ".github/workflows/jogar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Jogar/navegador
      - id: publicacao
        uses: actions/deploy-pages@v4
